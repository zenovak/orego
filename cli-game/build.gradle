plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'edu.lclark.orego.ui.Orego'
}

group = 'com.zenovak'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':core')
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}