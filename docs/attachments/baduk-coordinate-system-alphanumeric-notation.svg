<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Baduk board alphanumeric coordinate system</title>
<desc>A 5 by 5 grid of intersections with the origin a1 at the bottom left. Columns are lettered a to e from left to right and rows are numbered 1 to 5 from bottom to top. One example point is marked at b4.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="450" fill="#FFFFFF"/>
<g stroke="#B4B2A9" stroke-width="1">
<line x1="200" y1="90" x2="200" y2="370"/>
<line x1="270" y1="90" x2="270" y2="370"/>
<line x1="340" y1="90" x2="340" y2="370"/>
<line x1="410" y1="90" x2="410" y2="370"/>
<line x1="480" y1="90" x2="480" y2="370"/>
<line x1="200" y1="90" x2="480" y2="90"/>
<line x1="200" y1="160" x2="480" y2="160"/>
<line x1="200" y1="230" x2="480" y2="230"/>
<line x1="200" y1="300" x2="480" y2="300"/>
<line x1="200" y1="370" x2="480" y2="370"/>
</g>
<g stroke="#444441" stroke-width="1.5" fill="none">
<line x1="200" y1="422" x2="520" y2="422" marker-end="url(#arrow)"/>
<line x1="130" y1="370" x2="130" y2="70" marker-end="url(#arrow)"/>
</g>
<g font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">
<text x="532" y="422">col</text>
<text x="130" y="48" text-anchor="middle">row</text>
<text x="214" y="352">a1</text>
</g>
<g font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">
<text x="200" y="394">a</text>
<text x="270" y="394">b</text>
<text x="340" y="394">c</text>
<text x="410" y="394">d</text>
<text x="480" y="394">e</text>
<text x="174" y="370">1</text>
<text x="174" y="300">2</text>
<text x="174" y="230">3</text>
<text x="174" y="160">4</text>
<text x="174" y="90">5</text>
</g>
<circle cx="200" cy="370" r="6" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.5"/>
<circle cx="270" cy="160" r="6" fill="#888780" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="284" y="178" font-size="12" fill="#5F5E5A" dominant-baseline="central">b4</text>
</svg>
